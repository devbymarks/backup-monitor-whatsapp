# Em deploy WAR no Tomcat externo, a porta HTTP e controlada pelo Tomcat.
# Esta propriedade e util apenas se a aplicacao for iniciada fora do Tomcat para diagnostico.
server.port=8080

monitor.base-dir=${MONITOR_BASE_DIR:/backup/clientes}
monitor.clients=${MONITOR_CLIENTS:}
monitor.interval-ms=${MONITOR_INTERVAL_MS:1800000}
monitor.initial-delay-ms=${MONITOR_INITIAL_DELAY_MS:60000}
monitor.limit-hours=${MONITOR_LIMIT_HOURS:24}
monitor.state-file=${MONITOR_STATE_FILE:/opt/monitor-backup/data/alerta-diario.dat}
monitor.time-zone=${MONITOR_TIME_ZONE:America/Sao_Paulo}

# Nunca grave credenciais reais no Git.
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.to=${WHATSAPP_TO:}
whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v23.0}

# text = texto livre; template = template Meta aprovado para mensagens proativas
whatsapp.message-mode=${WHATSAPP_MESSAGE_MODE:text}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:pt_BR}
